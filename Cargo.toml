[package]
name = "certinfo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"

[dependencies.chrono]
version = "0.4"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.sha2]
version = "0.10"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12", "logging"]

[dependencies.x509-parser]
version = "0.18"
features = ["verify"]

[dev-dependencies.rcgen]
version = "0.14"

[dev-dependencies.time]
version = "0.3"

[profile.release]
codegen-units = 1
debug = "full"
lto = true
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"
strip = "symbols"
incremental = true
